<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>星海 Notes · 归档站</title>
<style>
  :root{--bg:#eef1f7;--card:#ffffff;--ink:#1f2733;--sub:#5b6675;--line:#dde3ef;--deep:#0c1b33;--accent:#2f6bff;--gold:#c9a14a}
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--ink);font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;line-height:1.7}
  .wrap{max-width:900px;margin:0 auto;padding:40px 20px 70px}
  header{background:linear-gradient(160deg,var(--deep),#13294d);color:#fff;border-radius:20px;padding:38px 34px;margin-bottom:30px}
  header .badge{display:inline-block;font-size:12px;letter-spacing:3px;color:var(--gold);border:1px solid rgba(201,161,74,.6);border-radius:999px;padding:5px 14px}
  header h1{font-size:30px;margin:14px 0 8px}
  header p{color:#c7d2e6;font-size:15px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:24px 26px;margin-bottom:22px}
  .card .no{font-size:13px;color:var(--accent);font-weight:700;letter-spacing:1px}
  .card h2{font-size:22px;margin:8px 0 6px}
  .card .angle{display:inline-block;font-size:12px;background:#eaf0ff;color:var(--accent);border-radius:6px;padding:3px 10px;margin-bottom:12px}
  .card .links{display:flex;gap:12px;flex-wrap:wrap;margin-top:14px}
  .card .links a{text-decoration:none;font-size:14px;font-weight:600;padding:9px 16px;border-radius:10px;background:var(--deep);color:#fff}
  .card .links a.alt{background:#eef1f7;color:var(--deep)}
  .media{margin:10px 0}
  .media img{width:100%;border-radius:14px;border:1px solid var(--line)}
  .media video{width:100%;border-radius:14px;border:1px solid var(--line);background:#000}
  .caption{font-size:13px;color:var(--sub);margin-top:8px}
  footer{text-align:center;font-size:12.5px;color:var(--sub);margin-top:30px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="badge">星海 NOTES · ARCHIVE</div>
    <h1>星海 Notes 归档站</h1>
    <p>卫星 / 航天干货分享 + 突发大事深度专题 ｜ 核心视角：行业趋势的可预测性</p>
  </header>

  <div class="card">
    <div class="no">ISSUE #1 · 2026-08-05</div>
    <span class="angle">角度 · 行业趋势的可预测性</span>
    <h2>休斯破产：一场早被写进剧本的落幕</h2>
    <p class="caption">50 年 VSAT 先驱，2023 年刚把全球最大通信卫星送上天，2026 年 8 月却走进破产法庭。这不是黑天鹅——趋势早已剧透结局。</p>
    <div class="media">
      <img src="assets/infographic.png" alt="休斯破产信息图">
      <div class="caption">一图流信息图（点击可保存）</div>
    </div>
    <div class="media">
      <video src="assets/video.mp4" controls playsinline></video>
      <div class="caption">竖版 15s 短视频（视频号可用）</div>
    </div>
    <div class="links">
      <a href="issues/2026-08-05.html">阅读全文 →</a>
      <a class="alt" href="assets/infographic.png">信息图大图</a>
      <a class="alt" href="assets/video.mp4">下载短视频</a>
    </div>
  </div>

  <footer>星海 Notes · 由 Harry 自动归档 ｜ 公开沉淀，长期留存</footer>
</div>
</body>
</html>
